[project]
name = "musiclooper"
version = "0.1.0"
description = "A GUI application for looping music."
requires-python = ">=3.12"
dependencies = [
    "lazy-loader>=0.3",
    "librosa==0.10.2",
    "numba>=0.59.1",
    "numpy>=1.25.0,<2.0.0",
    "psutil>=5.9.8",
    "pyqt6>=6.4.0",
    "pyqt6-qt6>=6.4.0",
    "pyqt6-sip>=13.9.1",
    "pytaglib>=3.0.0",
    "rich>=13.4.2",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "yt-dlp>=2024.8.6",
]

